name: apply-supabase-patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-supabase-patch.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          set -euo pipefail
          cat .bootstrap/sb-00.b64 .bootstrap/sb-01.b64 .bootstrap/sb-02.b64 .bootstrap/sb-03.b64 .bootstrap/sb-04.b64 .bootstrap/sb-05.b64 .bootstrap/sb-06.b64 | base64 -d | xz -d > /tmp/p.patch
          echo "b13d657f289eb705458159249cd7a8770013800ed148703c385a5ab3e3760ab5  /tmp/p.patch" | sha256sum -c -
          git apply /tmp/p.patch
          echo "ee9c63c910ef2d297e15505438ff58156702a014306dc742a24685458e3a8fbb  invoice_scraper.html" | sha256sum -c -
          echo "825ac1f1efdc55a96a9641121e99c1097dc66d74927f82d8a4250458d2fa2a9f  supabase-schema.sql" | sha256sum -c -
          git rm -rq .bootstrap
          git add invoice_scraper.html supabase-schema.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Copy the library, layouts and settings to Supabase"
          git push origin HEAD:main
