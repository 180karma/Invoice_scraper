name: apply-upgrade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-upgrade.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -euo pipefail
          cat .bootstrap/u*.b64 | tr -d '\n\r ' | base64 -d > /tmp/p.xz
          echo "c5969b3962a9f7b00a43f563e27cf4d9eec557a2a51df7f62da22a442d041610  /tmp/p.xz" | sha256sum -c
          xz -dc /tmp/p.xz > /tmp/p.diff
          git apply --unidiff-zero /tmp/p.diff
          echo "12878697ffd9b70b1942d1bc8741a2228e3c54d87ca31a6cf8327beca9e48ee3  invoice_scraper.html" | sha256sum -c
          git rm -rq .bootstrap
          git add invoice_scraper.html
          git config user.name "Joe O'Leary"
          git config user.email "111162201+180karma@users.noreply.github.com"
          git commit -q -m "Invoice handling upgrades: auto layouts, auto-rotate, invoice folder, supplier contacts, tap-to-call/email, hidden API key"
          git push origin HEAD:main
          git log -1 --format=%H
