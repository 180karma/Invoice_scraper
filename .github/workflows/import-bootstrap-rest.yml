name: import-bootstrap-rest
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-bootstrap-rest.yml"
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch remaining .bootstrap chunks
        run: |
          set -euo pipefail
          if ! curl -fsSL -o /tmp/bootstrap-rest.tar.gz "https://n.uguu.se/hVAfcJyU.tar.gz"; then
            curl -fsSL -o /tmp/bootstrap-rest.tar.gz "https://tmpfiles.org/dl/1794452921.5700a057c51b5614/wsAi0E0eCxJ5/bootstrap-rest.tar.gz"
          fi
          echo "378e46470a9b44247c497c3be0f0f0882302e70f7c064ad5b25fd302272cd628  /tmp/bootstrap-rest.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bootstrap-rest.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bootstrap/*.b64
          git status
          git commit -m "Add .bootstrap/007.b64 through 036.b64"
          git push
