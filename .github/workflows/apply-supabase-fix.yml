name: apply-supabase-fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-supabase-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          set -euo pipefail
          echo "ee9c63c910ef2d297e15505438ff58156702a014306dc742a24685458e3a8fbb  invoice_scraper.html" | sha256sum -c -
          git apply --unidiff-zero .bootstrap/supabase-fix.patch
          echo "1073200a67133f6fdb53926e2232493e43688996391950b166ffcef95c2dafc2  invoice_scraper.html" | sha256sum -c -
          echo "825ac1f1efdc55a96a9641121e99c1097dc66d74927f82d8a4250458d2fa2a9f  supabase-schema.sql" | sha256sum -c -
          git rm -rq .bootstrap
          git add invoice_scraper.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Supabase sync: survive bad characters, explain failed sign-in links, keep the new connection after Replace key"
          git push origin HEAD:main
