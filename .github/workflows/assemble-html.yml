name: assemble-html
on:
  push:
    paths:
      - '_parts/**'
      - '.github/workflows/assemble-html.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts and verify sha256
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, sys
          parts = sorted(Path('_parts').glob('p*.bin'))
          if not parts:
              print('no parts yet'); sys.exit(0)
          data = b''.join(p.read_bytes() for p in parts)
          expected = 'd446618d362465ce7637161460a61a51232ef970aa81831843ce5343fab53c8f'
          got = hashlib.sha256(data).hexdigest()
          print('parts', [p.name for p in parts], 'bytes', len(data), 'sha256', got, 'match', got == expected)
          if got != expected:
              raise SystemExit('sha256 mismatch')
          Path('invoice_scraper.html').write_bytes(data)
          PY
      - name: Commit assembled file and cleanup
        run: |
          if [ ! -f invoice_scraper.html ]; then echo skip; exit 0; fi
          git config user.name "180karma"
          git config user.email "180karma@users.noreply.github.com"
          git add invoice_scraper.html
          git rm -r _parts || true
          git rm .github/workflows/assemble-html.yml || true
          git status
          git diff --cached --stat
          git commit -m "Add invoice_scraper.html"
          git push
