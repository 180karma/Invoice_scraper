name: One-shot enable Pages
on:
  push:
    paths:
      - .github/workflows/enable-pages.yml
permissions:
  contents: read
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          code=$(curl -s -o out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          msg=$(tr -d '\n' < out.json | cut -c1-300)
          echo "::warning::Pages API HTTP $code $msg"
          test "$code" = 201 -o "$code" = 409
